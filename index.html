<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parc Véhicules STAR</title>

 </head>

<body>

    <div class="container">

        <img src="images/logo-star.png 

        <h1>Parc Véhicules</h1>

        <div class="last-km">

            <span>Dernier relevé</span>

            <h2 id="dernierKm">408'038 km</h2>

            <small id="derniereDate">16.08.2026</small>

        </div>

        <label>Véhicule</label>

        <select id="vehicule">
            <option>413</option>
            <option>414</option>
            <option>415</option>
            <option>416</option>
            <option>417</option>
            <option>418</option>
            <option>419</option>
            <option>Logistique</option>
            <option>SMART</option>
        </select>

        <label>Kilométrage actuel</label>

        <input
            type="number"
            id="kilometres"
            placeholder="Entrer le compteur">

        <button
            class="btn-save"
            onclick="enregistrer()">
            Enregistrer
        </button>

        <button
            class="btn-edit"
            onclick="modifierDernier()">
            Modifier le dernier relevé
        </button>

        <p id="message"></p>

    </div>


</body>

</html>
