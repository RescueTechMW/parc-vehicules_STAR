<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parc Véhicules STAR</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <img src="logo-star.png" id="logo" alt="STAR Ambulances">

    <h1>Parc véhicules STAR</h1>

    <div class="last-km">

        <div class="last-label">
            Dernier relevé
        </div>

        <div id="dernierKm" class="last-value">
            408'038 km
        </div>

        <div id="derniereDate" class="last-date">
            16.08.2026
        </div>

    </div>

    <label>Véhicule</label>

    <select id="vehicule">
        <option>413</option>
        <option>414</option>
        <option>415</option>
        <option>416</option>
        <option>417</option>
        <option>418</option>
        <option>419</option>
        <option>Logistique</option>
        <option>SMART</option>
    </select>

    <label>Nouveau kilométrage</label>

    <input
        type="number"
        id="kilometres"
        placeholder="Ex : 410250">

    <button
        class="btn-save"
        onclick="enregistrer()">
        ✅ Enregistrer
    </button>

    <button
        class="btn-edit"
        onclick="modifierDernier()">
        ✏️ Modifier le dernier relevé
    </button>

    <p id="message"></p>

</div>
   <script src="app.js"></script>

</body>

</html>
